name: Aplicar suporte a PDFs na nuvem

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar correção dos PDFs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # 1) Firebase: adicionar Firebase Storage ao mesmo init já existente.
          s = s.replace(
              "let fbApp=null, fbDb=null, fbDocRef=null, fbReady=false;",
              "let fbApp=null, fbDb=null, fbDocRef=null, fbStorage=null, fbReady=false;\nlet storageUploadBytes=null, storageGetDownloadURL=null, storageRefFn=null;"
          )

          old_import = """    const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');\n    fbApp = initializeApp(FIREBASE_CONFIG);\n    fbDb = getFirestore(fbApp);\n    fbDocRef = doc(fbDb, FIREBASE_DOC_PATH.collection, FIREBASE_DOC_PATH.doc);\n    window.__fb = { getDoc, setDoc, onSnapshot }; // guarda as funções para uso posterior\n    fbReady = true;"""
          new_import = """    const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');\n    const { getStorage, ref: storageRef, uploadBytes, getDownloadURL } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js');\n    fbApp = initializeApp(FIREBASE_CONFIG);\n    fbDb = getFirestore(fbApp);\n    fbStorage = getStorage(fbApp);\n    fbDocRef = doc(fbDb, FIREBASE_DOC_PATH.collection, FIREBASE_DOC_PATH.doc);\n    storageUploadBytes = uploadBytes;\n    storageGetDownloadURL = getDownloadURL;\n    storageRefFn = storageRef;\n    window.__fb = { getDoc, setDoc, onSnapshot, uploadBytes, getDownloadURL, storageRef };\n    fbReady = true;"""
          if old_import not in s:
              raise SystemExit('Bloco Firebase não encontrado; correção interrompida.')
          s = s.replace(old_import, new_import, 1)

          # 2) Inserir helper de upload antes do registerNewModule.
          if 'async function uploadPdfToCloud(file, statusEl)' not in s:
              helper = r'''async function uploadPdfToCloud(file, statusEl){
  if(!fbReady || !fbStorage || !storageUploadBytes || !storageGetDownloadURL || !storageRefFn){
    throw new Error('Firebase Storage não está disponível.');
  }
  const cleanName = (file.name || 'modulo.pdf').replace(/[^a-zA-Z0-9._-]+/g,'_');
  const storagePath = `pdfs/${Date.now()}-${Math.random().toString(36).slice(2,9)}-${cleanName}`;
  const ref = storageRefFn(fbStorage, storagePath);
  if(statusEl) statusEl.textContent = '☁️ Enviando o PDF original para a nuvem...';
  await storageUploadBytes(ref, file, { contentType: file.type || 'application/pdf' });
  const url = await storageGetDownloadURL(ref);
  return { url, path: storagePath };
}

'''
              marker = 'function registerNewModule('
              if marker not in s:
                  raise SystemExit('registerNewModule não encontrado.')
              s = s.replace(marker, helper + marker, 1)

          # 3) Trocar registerNewModule para guardar URL/path do PDF.
          pattern = re.compile(r"function registerNewModule\(fileName, content, date\)\{.*?\n\}\n\n/\* na inicialização", re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Função registerNewModule não encontrada.')
          replacement = r'''function registerNewModule(fileName, content, date, pdfInfo=null){
  const colors = ['sand','sky','sage','lav','rose'];
  const id = nextModuleId();
  const title = 'Módulo '+MODULES.length;
  const subtitle = (fileName||'Novo módulo').replace(/\.pdf$/i,'').replace(/^Módulo[_\s-]*\d+[_\s-]*/i,'').replace(/[_-]+/g,' ').trim().slice(0,60) || 'Conteúdo importado';
  const meta = { id, title: 'Módulo '+(MODULES.length+1), subtitle, color: colors[MODULES.length % colors.length], pdfUrl: pdfInfo?.url || '', pdfPath: pdfInfo?.path || '' };
  const plannerRows = { morning: buildPlannerRowsFromBlocks(content.treinar), afternoon: [] };

  MODULES.push(meta);
  MODULE_CONTENT[id] = {
    estudar: content.estudar, treinar: content.treinar, dinamicas: content.dinamicas, flashcards: content.flashcards,
    plannerDefault: ()=>({ date:'', morning: plannerRows.morning.map(r=>[...r]), afternoon: [] })
  };
  STATE.planners[id] = MODULE_CONTENT[id].plannerDefault();
  if(date) STATE.planners[id].date = date;

  STATE.customModules = STATE.customModules || [];
  STATE.customModules.push({ meta, content, plannerRows, date: date||'', pdfUrl: pdfInfo?.url || '', pdfPath: pdfInfo?.path || '' });

  return id;
}

/* na inicialização'''
          s = s[:m.start()] + replacement + s[m.end():]

          # 4) Criar módulo novo a partir do PDF: fazer upload antes de registrar.
          old_new = r'''    const content = parseModuleFromText(fullText);
    const id = registerNewModule(file.name, content, date);
    STATE.uiModule.estudar = id; STATE.uiModule.treinar = id; STATE.uiModule.dinamicas = id;
    STATE.uiModule.flashcards = id; STATE.uiModule.planner = id;

    statusEl.textContent = `✅ Módulo criado com ${content.estudar.length} blocos! Já está em Estudar, Treinar, Dinâmicas, Flashcards e Planner${date?' — e no calendário':''}.`;'''
          new_new = r'''    const content = parseModuleFromText(fullText);
    const pdfInfo = await uploadPdfToCloud(file, statusEl);
    const id = registerNewModule(file.name, content, date, pdfInfo);
    STATE.pdfLibrary = STATE.pdfLibrary || [];
    STATE.pdfLibrary.push({
      id: 'pdf'+Date.now(), name: file.name, mod: id, date,
      rawText: fullText, sections: splitIntoSections(fullText),
      uploadedAt: new Date().toLocaleDateString('pt-BR'),
      url: pdfInfo.url, storagePath: pdfInfo.path
    });
    STATE.uiModule.estudar = id; STATE.uiModule.treinar = id; STATE.uiModule.dinamicas = id;
    STATE.uiModule.flashcards = id; STATE.uiModule.planner = id;

    statusEl.textContent = `✅ Módulo criado com ${content.estudar.length} blocos! Já está em Estudar, Treinar, Dinâmicas, Flashcards e Planner${date?' — e no calendário':''}.`;'''
          if old_new not in s:
              raise SystemExit('Fluxo de criação de módulo não encontrado.')
          s = s.replace(old_new, new_new, 1)

          # 5) Anexar PDF existente: fazer upload e salvar URL.
          old_attach = r'''    const sections = splitIntoSections(fullText);
    STATE.pdfLibrary = STATE.pdfLibrary || [];
    STATE.pdfLibrary.push({
      id: 'pdf'+Date.now(), name: file.name, mod: modId, date,
      rawText: fullText, sections, uploadedAt: new Date().toLocaleDateString('pt-BR')
    });'''
          new_attach = r'''    const sections = splitIntoSections(fullText);
    const pdfInfo = await uploadPdfToCloud(file, statusEl);
    STATE.pdfLibrary = STATE.pdfLibrary || [];
    STATE.pdfLibrary.push({
      id: 'pdf'+Date.now(), name: file.name, mod: modId, date,
      rawText: fullText, sections, uploadedAt: new Date().toLocaleDateString('pt-BR'),
      url: pdfInfo.url, storagePath: pdfInfo.path
    });'''
          if old_attach not in s:
              raise SystemExit('Fluxo de anexar PDF não encontrado.')
          s = s.replace(old_attach, new_attach, 1)

          # 6) Biblioteca: links e visualização incorporada quando houver URL.
          old_library = r'''          <h3 style="margin-top:8px;">📄 ${p.name}</h3>
          <p style="font-size:12px; color:var(--ink-soft); margin:0;">Enviado em ${p.uploadedAt}${p.date?(' · Data do módulo: '+p.date):''}</p>
        </div>
        <button class="icon-btn no-print" data-del-pdf="${p.id}">🗑️</button>
      </div>
      <div class="stitch"></div>
      ${p.sections.map((s,i)=>`'''
          new_library = r'''          <h3 style="margin-top:8px;">📄 ${p.name}</h3>
          <p style="font-size:12px; color:var(--ink-soft); margin:0;">Enviado em ${p.uploadedAt}${p.date?(' · Data do módulo: '+p.date):''}</p>
          ${p.url ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><a class="btn btn-primary btn-sm" href="${esc(p.url)}" target="_blank" rel="noopener">📄 Abrir PDF original</a><button class="btn btn-ghost btn-sm" type="button" data-view-pdf="${p.id}">👁️ Visualizar aqui</button></div>` : `<p style="font-size:12px;color:var(--rose-ink);margin-top:8px;">⚠️ Este PDF antigo não possui arquivo original na nuvem. Reenvie-o uma vez.</p>`}
        </div>
        <button class="icon-btn no-print" data-del-pdf="${p.id}">🗑️</button>
      </div>
      <div class="stitch"></div>
      ${p.url ? `<div id="pdfviewer-${p.id}" style="display:none;margin-bottom:12px;"><iframe src="${esc(p.url)}" title="${esc(p.name)}" style="width:100%;height:680px;border:1px solid var(--line);border-radius:14px;background:#fff;"></iframe></div>` : ''}
      ${p.sections.map((s,i)=>`'''
          if old_library not in s:
              raise SystemExit('Render da biblioteca de PDFs não encontrado.')
          s = s.replace(old_library, new_library, 1)

          old_del = r'''  root.querySelectorAll('[data-del-pdf]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      STATE.pdfLibrary = STATE.pdfLibrary.filter(p=>p.id!==btn.dataset.delPdf);
      scheduleSave(); renderPdfLibrary();
    });
  });
}'''
          new_del = r'''  root.querySelectorAll('[data-view-pdf]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const box = document.getElementById('pdfviewer-'+btn.dataset.viewPdf);
      if(!box) return;
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : 'block';
      btn.textContent = open ? '👁️ Visualizar aqui' : '🙈 Fechar visualização';
    });
  });
  root.querySelectorAll('[data-del-pdf]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      STATE.pdfLibrary = STATE.pdfLibrary.filter(p=>p.id!==btn.dataset.delPdf);
      scheduleSave(); renderPdfLibrary();
    });
  });
}'''
          if old_del not in s:
              raise SystemExit('Final da biblioteca de PDFs não encontrado.')
          s = s.replace(old_del, new_del, 1)

          path.write_text(s, encoding='utf-8')
          print('index.html atualizado com suporte a PDFs na nuvem.')
          PY

      - name: Verificar e publicar alteração
        run: |
          node --check <(grep -o '<script[^>]*>\|</script>\|.*' index.html) 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige armazenamento de PDFs na nuvem"
          git push