name: Corrigir PDFs na nuvem

on:
  push:
    branches:
      - main

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Firebase Storage
          s = s.replace(
              'let fbApp=null, fbDb=null, fbDocRef=null, fbReady=false;',
              'let fbApp=null, fbDb=null, fbDocRef=null, fbStorage=null, fbReady=false;\nlet storageUploadBytes=null, storageGetDownloadURL=null, storageRefFn=null;',
              1
          )

          old = """    const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    fbApp = initializeApp(FIREBASE_CONFIG);
    fbDb = getFirestore(fbApp);
    fbDocRef = doc(fbDb, FIREBASE_DOC_PATH.collection, FIREBASE_DOC_PATH.doc);
    window.__fb = { getDoc, setDoc, onSnapshot }; // guarda as funções para uso posterior
    fbReady = true;"""
          new = """    const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const { getStorage, ref: storageRef, uploadBytes, getDownloadURL } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js');
    fbApp = initializeApp(FIREBASE_CONFIG);
    fbDb = getFirestore(fbApp);
    fbStorage = getStorage(fbApp);
    fbDocRef = doc(fbDb, FIREBASE_DOC_PATH.collection, FIREBASE_DOC_PATH.doc);
    storageUploadBytes = uploadBytes;
    storageGetDownloadURL = getDownloadURL;
    storageRefFn = storageRef;
    window.__fb = { getDoc, setDoc, onSnapshot, uploadBytes, getDownloadURL, storageRef };
    fbReady = true;"""
          if old not in s:
              raise SystemExit('Bloco Firebase não encontrado')
          s = s.replace(old, new, 1)

          helper = r'''async function uploadPdfToCloud(file, statusEl){
  if(!fbReady || !fbStorage || !storageUploadBytes || !storageGetDownloadURL || !storageRefFn){
    throw new Error('Firebase Storage não está disponível.');
  }
  const cleanName = (file.name || 'modulo.pdf').replace(/[^a-zA-Z0-9._-]+/g,'_');
  const storagePath = 'pdfs/'+Date.now()+'-'+Math.random().toString(36).slice(2,9)+'-'+cleanName;
  const ref = storageRefFn(fbStorage, storagePath);
  if(statusEl) statusEl.textContent = '☁️ Enviando o PDF original para a nuvem...';
  await storageUploadBytes(ref, file, { contentType: file.type || 'application/pdf' });
  const url = await storageGetDownloadURL(ref);
  return { url, path: storagePath };
}

'''
          if 'async function uploadPdfToCloud(file, statusEl)' not in s:
              s = s.replace('function registerNewModule(', helper + 'function registerNewModule(', 1)

          reg = re.compile(r'function registerNewModule\(fileName, content, date\)\{.*?\n\}\n\n/\* na inicialização', re.S)
          reg_new = r'''function registerNewModule(fileName, content, date, pdfInfo=null){
  const colors = ['sand','sky','sage','lav','rose'];
  const id = nextModuleId();
  const subtitle = (fileName||'Novo módulo').replace(/\.pdf$/i,'').replace(/^Módulo[_\s-]*\d+[_\s-]*/i,'').replace(/[_-]+/g,' ').trim().slice(0,60) || 'Conteúdo importado';
  const meta = { id, title: 'Módulo '+(MODULES.length+1), subtitle, color: colors[MODULES.length % colors.length], pdfUrl: pdfInfo?.url || '', pdfPath: pdfInfo?.path || '' };
  const plannerRows = { morning: buildPlannerRowsFromBlocks(content.treinar), afternoon: [] };
  MODULES.push(meta);
  MODULE_CONTENT[id] = {
    estudar: content.estudar, treinar: content.treinar, dinamicas: content.dinamicas, flashcards: content.flashcards,
    plannerDefault: ()=>({ date:'', morning: plannerRows.morning.map(r=>[...r]), afternoon: [] })
  };
  STATE.planners[id] = MODULE_CONTENT[id].plannerDefault();
  if(date) STATE.planners[id].date = date;
  STATE.customModules = STATE.customModules || [];
  STATE.customModules.push({ meta, content, plannerRows, date: date||'', pdfUrl: pdfInfo?.url || '', pdfPath: pdfInfo?.path || '' });
  return id;
}

/* na inicialização'''
          if not reg.search(s):
              raise SystemExit('registerNewModule não encontrado')
          s = reg.sub(reg_new, s, count=1)

          flow1 = re.compile(r'/\* ---- fluxo 1: criar módulo novo a partir do PDF ---- \*/.*?/\* ---- fluxo 2: anexar PDF como referência a um módulo já existente ---- \*/', re.S)
          flow1_new = r'''/* ---- fluxo 1: criar módulo novo a partir do PDF ---- */
          document.getElementById('newModInput').addEventListener('change', async (e)=>{
            const file = e.target.files[0];
            if(!file) return;
            const date = document.getElementById('newModDate').value;
            const statusEl = document.getElementById('newModStatus');
            if(typeof pdfjsLib === 'undefined'){
              statusEl.textContent = '⚠️ Não foi possível carregar o leitor de PDF (verifique sua conexão com a internet).';
              return;
            }
            statusEl.textContent = 'Abrindo arquivo...';
            try{
              const fullText = await extractPdfText(file, 'newModStatus');
              statusEl.textContent = 'Organizando o conteúdo em blocos...';
              const content = parseModuleFromText(fullText);
              const pdfInfo = await uploadPdfToCloud(file, statusEl);
              const id = registerNewModule(file.name, content, date, pdfInfo);
              STATE.pdfLibrary = STATE.pdfLibrary || [];
              STATE.pdfLibrary.push({
                id:'pdf'+Date.now(), name:file.name, mod:id, date,
                rawText:fullText, sections:splitIntoSections(fullText),
                uploadedAt:new Date().toLocaleDateString('pt-BR'),
                url:pdfInfo.url, storagePath:pdfInfo.path
              });
              STATE.uiModule.estudar=id; STATE.uiModule.treinar=id; STATE.uiModule.dinamicas=id;
              STATE.uiModule.flashcards=id; STATE.uiModule.planner=id;
              statusEl.textContent = `✅ Módulo criado com ${content.estudar.length} blocos! Já está em Estudar, Treinar, Dinâmicas, Flashcards e Planner${date?' — e no calendário':''}.`;
              e.target.value=''; document.getElementById('newModDate').value='';
              scheduleSave(); refreshEverythingAfterModuleChange();
            }catch(err){
              console.error(err);
              statusEl.textContent = err && /Storage|Firebase/i.test(err.message||'') ? '❌ O PDF foi lido, mas não consegui enviá-lo para a nuvem. Verifique se o Firebase Storage está ativado e se as regras permitem upload.' : '❌ Não consegui ler esse PDF. Verifique se o arquivo não está corrompido ou protegido por senha.';
            }
          });

          /* ---- fluxo 2: anexar PDF como referência a um módulo já existente ---- */'''
          if not flow1.search(s):
              raise SystemExit('fluxo 1 não encontrado')
          s = flow1.sub(flow1_new, s, count=1)

          flow2 = re.compile(r'/\* ---- fluxo 2: anexar PDF como referência a um módulo já existente ---- \*/.*?\nfunction renderPdfLibrary\(\)\{', re.S)
          flow2_new = r'''/* ---- fluxo 2: anexar PDF como referência a um módulo já existente ---- */
          document.getElementById('pdfInput').addEventListener('change', async (e)=>{
            const file=e.target.files[0]; if(!file) return;
            const modId=document.getElementById('pdfModSelect').value;
            const date=document.getElementById('pdfDate').value;
            const statusEl=document.getElementById('pdfStatus');
            if(typeof pdfjsLib==='undefined'){
              statusEl.textContent='⚠️ Não foi possível carregar o leitor de PDF (verifique sua conexão com a internet).'; return;
            }
            statusEl.textContent='Abrindo arquivo...';
            try{
              const fullText=await extractPdfText(file,'pdfStatus');
              const sections=splitIntoSections(fullText);
              const pdfInfo=await uploadPdfToCloud(file,statusEl);
              STATE.pdfLibrary=STATE.pdfLibrary||[];
              STATE.pdfLibrary.push({
                id:'pdf'+Date.now(), name:file.name, mod:modId, date,
                rawText:fullText, sections, uploadedAt:new Date().toLocaleDateString('pt-BR'),
                url:pdfInfo.url, storagePath:pdfInfo.path
              });
              if(date && MODULES.some(m=>m.id===modId)){
                STATE.planners[modId].date=date; renderCalendar(); renderModuleCards();
              }
              statusEl.textContent=`✅ "${file.name}" lido com sucesso — ${sections.length} seção(ões) identificada(s).`;
              e.target.value=''; document.getElementById('pdfDate').value='';
              scheduleSave(); renderPdfLibrary();
            }catch(err){
              console.error(err);
              statusEl.textContent=err && /Storage|Firebase/i.test(err.message||'') ? '❌ O PDF foi lido, mas não consegui enviá-lo para a nuvem. Verifique se o Firebase Storage está ativado e se as regras permitem upload.' : '❌ Não consegui ler esse PDF. Verifique se o arquivo não está corrompido ou protegido por senha.';
            }
          });

          function renderPdfLibrary(){'''
          if not flow2.search(s):
              raise SystemExit('fluxo 2 não encontrado')
          s = flow2.sub(flow2_new, s, count=1)

          lib = re.compile(r'function renderPdfLibrary\(\)\{.*?\n\}\nfunction esc\(s\)', re.S)
          lib_new = r'''function renderPdfLibrary(){
            fillPdfModSelect();
            const root=document.getElementById('pdfLibraryList');
            const list=STATE.pdfLibrary||[];
            if(list.length===0){root.innerHTML='<p style="color:var(--ink-soft);">Nenhum PDF de referência anexado ainda.</p>';return;}
            root.innerHTML=list.slice().reverse().map(p=>`
              <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                  <div>
                    <span class="pill">${p.mod==='geral'?'Geral':moduleLabel(p.mod)}</span>
                    <h3 style="margin-top:8px;">📄 ${p.name}</h3>
                    <p style="font-size:12px;color:var(--ink-soft);margin:0;">Enviado em ${p.uploadedAt}${p.date?(' · Data do módulo: '+p.date):''}</p>
                    ${p.url?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><a class="btn btn-primary btn-sm" href="${esc(p.url)}" target="_blank" rel="noopener">📄 Abrir PDF original</a><button class="btn btn-ghost btn-sm" type="button" data-view-pdf="${p.id}">👁️ Visualizar aqui</button></div>`:`<p style="font-size:12px;color:var(--rose-ink);margin-top:8px;">⚠️ Este PDF antigo não possui arquivo original na nuvem. Reenvie-o uma vez.</p>`}
                  </div>
                  <button class="icon-btn no-print" data-del-pdf="${p.id}">🗑️</button>
                </div>
                <div class="stitch"></div>
                ${p.url?`<div id="pdfviewer-${p.id}" style="display:none;margin-bottom:12px;"><iframe src="${esc(p.url)}" title="${esc(p.name)}" style="width:100%;height:680px;border:1px solid var(--line);border-radius:14px;background:#fff;"></iframe></div>`:''}
                ${p.sections.map((s,i)=>`<details class="block" style="box-shadow:none;margin-bottom:8px;"><summary style="padding:10px 14px;font-size:13px;"><div class="meta"><span>📑 ${esc(s.title)}</span></div><span class="chev">▸</span></summary><div class="inner" style="padding:4px 14px 14px;"><p style="font-size:12.5px;white-space:pre-wrap;">${esc(s.text.slice(0,1200))}${s.text.length>1200?'…':''}</p></div></details>`).join('')}
              </div>`).join('');
            root.querySelectorAll('[data-view-pdf]').forEach(btn=>btn.addEventListener('click',()=>{
              const box=document.getElementById('pdfviewer-'+btn.dataset.viewPdf); if(!box)return;
              const open=box.style.display!=='none'; box.style.display=open?'none':'block';
              btn.textContent=open?'👁️ Visualizar aqui':'🙈 Fechar visualização';
            }));
            root.querySelectorAll('[data-del-pdf]').forEach(btn=>btn.addEventListener('click',()=>{
              STATE.pdfLibrary=STATE.pdfLibrary.filter(p=>p.id!==btn.dataset.delPdf); scheduleSave(); renderPdfLibrary();
            }));
          }
          function esc(s)'''
          if not lib.search(s):
              raise SystemExit('renderPdfLibrary não encontrado')
          s = lib.sub(lib_new, s, count=1)

          p.write_text(s, encoding='utf-8')
          print('PDF cloud patch applied')
          PY

      - name: Validar HTML e salvar
        run: |
          grep -q "async function uploadPdfToCloud" index.html
          grep -q "firebase-storage.js" index.html
          grep -q "Abrir PDF original" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
          else
            git commit -m "Corrige armazenamento de PDFs na nuvem"
            git push
          fi